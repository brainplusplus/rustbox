name: release

# Three platforms, one release.
#
# Every job builds natively: Tauri links the OS webview (WebView2, WKWebView,
# WebKitGTK), so there is no cross-compiling story here and a matrix of runners is
# the honest way to produce all three installers.
#
# macOS is built once as a universal binary. Apple Silicon is the default target,
# but Intel Macs are still in use and `macos-15-intel` is the last x86_64 runner
# image GitHub will ever offer (retires August 2027), so depending on it long-term
# would make this pipeline expire. A universal `.dmg` runs natively on both and
# does not care which runners exist later.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    # A tag build is expensive; PRs get the same builds so a break is found before
    # release day, but artifacts are not uploaded.
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  # Warnings are worth reading but should not fail a release; `cargo test` and the
  # UI/probe gates below are what decide pass or fail.
  RUSTFLAGS: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Cheap gate first, so a broken test never burns four OS builds.
  verify:
    name: test + ui + probes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # No `cargo fmt --check` here on purpose. This tree is formatted by hand at
      # two spaces while rustfmt defaults to four, so a fmt gate would report ~7000
      # changed lines and fail every build for a style the code does not use.
      # Formatting every file at once is a separate, reviewable change.

      # The suite covers the WebView2 skew detection and the tab-open guards, which
      # are the parts most likely to regress silently: they only misbehave on a
      # machine that has been up long enough for Windows to swap the runtime.
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --release

      - name: ui parses and settings panes line up
        run: node scripts/check-ui.js

      # The probe suites drive the real ui/index.html in headless Chrome with a
      # stubbed `window.__TAURI__`, so they need no build and no installed app.
      # They are the only check that exercises the actual startup path, tab strip
      # and settings panes rather than the modules behind them.
      - name: probe suites
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/probe-all.ps1
        shell: pwsh

  build:
    name: build ${{ matrix.name }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: ""
            bundles: nsis
            artifact: rustbox-windows-x64
            glob: |
              src-tauri/target/release/bundle/nsis/*.exe
          - name: linux-x64
            os: ubuntu-22.04
            target: ""
            bundles: deb,appimage
            artifact: rustbox-linux-x64
            glob: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          - name: macos-universal
            os: macos-latest
            target: universal-apple-darwin
            bundles: dmg
            artifact: rustbox-macos-universal
            glob: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Both Apple architectures, added only for the universal job. A single
      # matrix-driven `targets:` value would emit an empty string on the other
      # platforms, which the action does not accept.
      - name: apple targets for the universal build
        if: matrix.target == 'universal-apple-darwin'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # WebKitGTK and libsoup are what the Linux webview links against; without
      # them the build fails at link time with no useful message.
      - name: linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf file

      # build-installer.mjs builds the MCP sidecar first and stages it under the
      # triple the bundler will look for, then runs `cargo tauri build`. Doing it by
      # hand here would drift from what a local build does.
      - name: release build
        env:
          RB_BUNDLES: ${{ matrix.bundles }}
          RB_TARGET: ${{ matrix.target }}
        # RB_TARGET empty means "native", which is what the script already assumes.
        run: node scripts/build-installer.mjs

      # A bundle that exists but cannot start is worse than a failed build, because
      # the release job would happily publish it.
      - name: smoke test the app binary
        shell: pwsh
        run: |
          $name = if ($env:RUNNER_OS -eq 'Windows') { 'rustbox.exe' } else { 'rustbox' }
          $shimName = if ($env:RUNNER_OS -eq 'Windows') { 'rustbox-mcp.exe' } else { 'rustbox-mcp' }
          $root = if ('${{ matrix.target }}' -eq '') { 'src-tauri/target/release' } else { 'src-tauri/target/${{ matrix.target }}/release' }
          $exe = Join-Path $root $name
          if (-not (Test-Path $exe)) { throw "app binary missing: $exe" }
          $size = (Get-Item $exe).Length
          "app binary: $exe ($size bytes)"
          if ($size -lt 5MB) { throw "app binary is implausibly small: $size bytes" }
          $shim = Join-Path $root $shimName
          if (-not (Test-Path $shim)) { throw "MCP sidecar missing next to the app: $shim" }
          "sidecar: $shim ($((Get-Item $shim).Length) bytes)"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: list assets
        run: find dist -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          # A tag name like v0.1.0 becomes the release title, and GitHub marks the
          # first non-prerelease as "Latest" on its own.
          name: RustBox ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/**/*
