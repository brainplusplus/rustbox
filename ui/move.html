<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RustBox</title>
    <!--
      The window a launch shows while a queued data-folder move runs.

      It is the only surface that exists during the move, and it deliberately
      owns nothing in the data folder: its own webview profile lives in the
      temp directory (`move_window.rs`), because a profile inside the tree
      being copied would hold handles on it.

      Everything here is polled rather than pushed. The copy reports progress
      thousands of times, and a request every 250 ms costs nothing next to the
      seconds a 12 GB copy takes - while polling has no way to lose the final
      message, which an event listener does if it is not yet registered.
    -->
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0f0d;
        --surface: #121815;
        --line: #1f2a24;
        --text: #e6ede9;
        --dim: #8da197;
        --accent: #34d399;
        --danger: #f87171;
        --warn: #fbbf24;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font: 13px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        /* The window is not resizable, but a temporary drag must not tear the
           layout apart either. */
        overflow: hidden;
        user-select: none;
      }
      #card {
        width: 100%;
        padding: 26px 30px 24px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: .1px;
      }
      #paths {
        margin: 0;
        color: var(--dim);
        font: 11px/1.6 ui-monospace, 'Cascadia Mono', Consolas, monospace;
        word-break: break-all;
      }
      #paths b { color: var(--text); font-weight: 500; }
      #head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-top: 6px;
      }
      #phase { color: var(--dim); font-size: 12px; }
      #pct {
        font: 600 20px/1 ui-monospace, 'Cascadia Mono', Consolas, monospace;
        font-variant-numeric: tabular-nums;
      }
      #track {
        height: 6px;
        border-radius: 999px;
        background: var(--surface);
        border: 1px solid var(--line);
        overflow: hidden;
      }
      #fill {
        height: 100%;
        width: 0;
        border-radius: 999px;
        background: var(--accent);
        transition: width .2s linear;
      }
      #detail {
        margin: 0;
        color: var(--dim);
        font-size: 11.5px;
        font-variant-numeric: tabular-nums;
      }
      #note { margin: 0; font-size: 12px; color: var(--dim); }
      #note.warn { color: var(--warn); }
      #note.bad { color: var(--danger); }
      #actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 8px;
      }
      #actions:empty { display: none; }
      button {
        font: inherit;
        font-size: 12px;
        padding: 7px 14px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
      }
      button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
      button:disabled { opacity: .5; cursor: default; }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #052e16;
        font-weight: 600;
      }
      button.primary:hover:not(:disabled) { filter: brightness(1.08); color: #052e16; }
      button.ghost { background: transparent; border-color: transparent; color: var(--dim); }
      button.ghost:hover:not(:disabled) { background: var(--surface); color: var(--text); }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="card">
      <h1 id="title">Moving your data folder</h1>
      <p id="paths"></p>

      <div id="head">
        <span id="phase">Starting</span>
        <span id="pct">0%</span>
      </div>
      <div id="track"><div id="fill"></div></div>
      <p id="detail"></p>

      <p id="note" hidden></p>
      <div id="actions"></div>
    </div>

    <script>
      'use strict';
      const { invoke } = window.__TAURI__.core;

      const ui = {
        title: document.getElementById('title'),
        paths: document.getElementById('paths'),
        phase: document.getElementById('phase'),
        pct: document.getElementById('pct'),
        fill: document.getElementById('fill'),
        detail: document.getElementById('detail'),
        note: document.getElementById('note'),
        actions: document.getElementById('actions'),
      };

      const PHASES = {
        start: 'Preparing',
        copy: 'Copying',
        verify: 'Checking every file arrived',
        finish: 'Switching over',
      };

      function bytes(n) {
        if (!n) return '0 MB';
        const gb = n / (1024 * 1024 * 1024);
        if (gb >= 1) return `${gb.toFixed(gb >= 10 ? 0 : 1)} GB`;
        return `${(n / (1024 * 1024)).toFixed(0)} MB`;
      }

      function count(n) {
        return Number(n || 0).toLocaleString('en-US');
      }

      function duration(seconds) {
        const s = Number(seconds || 0);
        if (s < 60) return `${s}s`;
        const m = Math.floor(s / 60);
        const rest = s % 60;
        return rest ? `${m} m ${rest} s` : `${m} m`;
      }

      let painted = '';

      /** Buttons are rebuilt only when the state changes: replacing them on
       *  every poll would swallow a click that lands mid-update. */
      function actions(buttons) {
        const key = buttons.map((b) => b.label).join('|');
        if (key === painted) return;
        painted = key;
        ui.actions.textContent = '';
        for (const spec of buttons) {
          const b = document.createElement('button');
          b.textContent = spec.label;
          if (spec.kind) b.className = spec.kind;
          b.addEventListener('click', () => {
            // One answer per question: a second click while the window is
            // closing must not restart the copy.
            b.disabled = true;
            spec.run();
          });
          ui.actions.append(b);
        }
      }

      /** Start the move again and resume polling.
       *
       *  A finished state stops the poll loop on purpose, so a retry that did
       *  not restart it would leave the window frozen on the old error while
       *  the backend copied in the background. */
      function retry() {
        painted = '';
        invoke('move_start').then(
          () => setTimeout(tick, 150),
          (e) => {
            ui.note.hidden = false;
            ui.note.className = 'bad';
            ui.note.textContent = String((e && e.message) || e);
          }
        );
      }

      function show(s) {
        const total = s.totalBytes || 0;
        const done = s.bytes || 0;
        const pct = total ? Math.min(100, Math.round((done / total) * 100)) : 0;

        ui.paths.innerHTML = `<b>${s.from || ''}</b> &rarr; <b>${s.to || ''}</b>`;
        ui.note.hidden = true;
        ui.note.className = '';

        if (s.state === 'running') {
          ui.title.textContent = 'Moving your data folder';
          ui.phase.textContent = PHASES[s.phase] || 'Working';
          ui.pct.textContent = `${pct}%`;
          ui.fill.style.width = `${pct}%`;
          ui.fill.style.background = 'var(--accent)';
          ui.detail.textContent = total
            ? `${count(s.files)} of ${count(s.totalFiles)} files \u00b7 ${bytes(done)} of ${bytes(total)}`
            : 'Measuring the data folder\u2026';
          actions([{ label: 'Cancel', kind: 'ghost', run: () => invoke('move_cancel') }]);
          return;
        }

        if (s.state === 'done') {
          ui.title.textContent = 'Data folder moved';
          ui.phase.textContent = 'Finished';
          ui.pct.textContent = '100%';
          ui.fill.style.width = '100%';
          ui.detail.textContent = `${count(s.files)} files \u00b7 ${bytes(s.bytes)} \u00b7 ${duration(s.seconds)}`;
          // The move already succeeded, so the only thing left is to open the
          // app on the new folder. Said plainly, because "restart" reads as
          // "the move is not done yet".
          ui.note.hidden = false;
          ui.note.className = s.warning ? 'warn' : '';
          ui.note.textContent = s.warning || 'RustBox will now open on the new folder.';
          actions([{ label: 'Open RustBox', kind: 'primary', run: () => invoke('move_continue') }]);
          return;
        }

        if (s.state === 'cancelled') {
          ui.title.textContent = 'Move cancelled';
          ui.phase.textContent = 'Nothing was moved';
          ui.pct.textContent = '';
          ui.fill.style.width = '0%';
          ui.detail.textContent = 'The copy was discarded and every file is still in the old folder.';
          actions([
            { label: 'Open RustBox', kind: 'primary', run: () => invoke('move_continue') },
            { label: 'Try again', kind: 'ghost', run: retry },
          ]);
          return;
        }

        // failed
        ui.title.textContent = 'The move did not happen';
        ui.phase.textContent = 'Failed';
        ui.pct.textContent = '';
        ui.fill.style.width = '0%';
        ui.fill.style.background = 'var(--danger)';
        ui.detail.textContent = `Nothing was copied. Your data is still in ${s.from || 'the old folder'}.`;
        ui.note.hidden = false;
        ui.note.className = 'bad';
        ui.note.textContent = s.error || 'Unknown error.';
        actions([
          { label: 'Try again', kind: 'primary', run: retry },
          { label: 'Open RustBox anyway', kind: 'ghost', run: () => invoke('move_continue') },
        ]);
      }

      async function tick() {
        let s;
        try {
          s = await invoke('move_status');
        } catch (e) {
          // The window outlives a domain error, but not a dead process: if the
          // endpoint is gone there is nothing left to paint.
          ui.note.hidden = false;
          ui.note.className = 'bad';
          ui.note.textContent = String((e && e.message) || e);
          return;
        }
        show(s);
        // A finished move stops polling: the answer cannot change any more,
        // and the buttons are the only thing left to act on.
        if (s.state === 'running') setTimeout(tick, 250);
      }

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') invoke('move_cancel');
      });

      tick();
    </script>
  </body>
</html>
