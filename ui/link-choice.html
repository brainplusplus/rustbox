<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Open link</title>
<style>
  /* A modal question, not a menu. The window it lives in covers the whole
     content area and is transparent, so the dimming and the card are drawn
     here; everything outside the card is a click target that cancels. */
  :root {
    --surface: #0E1526;
    --surface-2: #151E31;
    --row: #131C2E;
    --row-hover: #1A2337;
    --border: #26314A;
    --hairline: #1D2740;
    --text: #E6EDF7;
    --text-dim: #8A99B0;
    --text-faint: #5E6D85;
    --accent: #34D399;
    --accent-soft: rgba(52, 211, 153, .12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: transparent;
    color: var(--text);
    user-select: none;
    font-family: 'Segoe UI Variable Text', 'Segoe UI', Inter, system-ui, sans-serif;
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
  }
  button { cursor: default; border: none; background: none; color: inherit; font: inherit; }

  #scrim {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(2, 6, 23, .55);
    animation: fade .12s ease-out;
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  #card {
    display: flex;
    flex-direction: column;
    width: 460px;
    max-width: 100%;
    max-height: 100%;
    padding: 18px 18px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 13px;
    box-shadow: 0 22px 60px rgba(0, 0, 0, .6), 0 3px 10px rgba(0, 0, 0, .4);
    animation: rise .13s ease-out;
  }
  @keyframes rise { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }

  .lc-head { display: flex; align-items: baseline; gap: 8px; }
  .lc-title { font-size: 14.5px; font-weight: 650; letter-spacing: -.01em; }
  .lc-app {
    margin-left: auto;
    max-width: 45%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-faint);
  }
  /* The link itself. Host first, then the rest: two links on the same site
     differ by path, and the host is what tells the user whose page it is. */
  .lc-url {
    margin-top: 9px;
    padding: 7px 9px;
    border-radius: 8px;
    background: var(--surface-2);
    box-shadow: inset 0 0 0 1px var(--hairline);
    font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
    font-size: 11.5px;
    line-height: 1.5;
    color: var(--text-dim);
    word-break: break-all;
    max-height: 54px;
    overflow: hidden;
  }
  .lc-url b { color: var(--text); font-weight: 600; }

  .lc-opts { display: flex; flex-direction: column; gap: 5px; margin-top: 13px; }
  .lc-opt {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    padding: 9px 10px;
    border-radius: 9px;
    background: var(--row);
    box-shadow: inset 0 0 0 1px var(--hairline);
    text-align: left;
    transition: background .12s, box-shadow .12s;
  }
  .lc-opt:hover { background: var(--row-hover); }
  .lc-opt[aria-checked="true"] {
    background: var(--accent-soft);
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .lc-opt:focus-visible { outline: none; box-shadow: inset 0 0 0 1px var(--accent); }
  .lc-opt svg {
    flex: 0 0 17px;
    width: 17px;
    height: 17px;
    margin-top: 1px;
    color: var(--text-dim);
    stroke: currentColor;
    fill: none;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: color .12s;
  }
  .lc-opt[aria-checked="true"] svg { color: var(--accent); }
  .lc-opt .body { flex: 1 1 auto; min-width: 0; }
  .lc-opt .name { display: block; font-size: 13px; font-weight: 600; }
  .lc-opt .desc { display: block; margin-top: 1px; font-size: 11.5px; line-height: 1.45; color: var(--text-dim); }
  /* A quiet number, so the option can be picked without the mouse. */
  .lc-opt .key {
    flex: 0 0 auto;
    margin-top: 2px;
    font-size: 10.5px;
    font-weight: 600;
    color: var(--text-faint);
    font-variant-numeric: tabular-nums;
  }
  .lc-opt[aria-checked="true"] .key { color: var(--accent); }

  .lc-foot { display: flex; align-items: center; gap: 10px; margin-top: 13px; }
  .lc-remember { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--text-dim); }
  .lc-remember input { width: 13px; height: 13px; accent-color: var(--accent); cursor: default; }
  .lc-remember:hover { color: var(--text); }
  .lc-actions { display: flex; gap: 7px; margin-left: auto; }
  .lc-btn { padding: 7px 15px; border-radius: 8px; font-size: 12.5px; font-weight: 600; transition: background .12s; }
  .lc-btn.ghost { color: var(--text-dim); }
  .lc-btn.ghost:hover { background: var(--surface-2); color: var(--text); }
  .lc-btn.primary { background: var(--accent); color: #052E16; }
  .lc-btn.primary:hover { background: #4ADE9B; }
  .lc-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    #scrim, #card { animation: none; }
    .lc-opt, .lc-opt svg, .lc-btn { transition: none; }
  }
</style>
</head>
<body>
<div id="scrim">
  <div id="card" role="dialog" aria-modal="true" aria-labelledby="lc-title">
    <div class="lc-head">
      <span class="lc-title" id="lc-title">Open this link</span>
      <span class="lc-app" id="lc-app"></span>
    </div>
    <div class="lc-url" id="lc-url"></div>
    <div class="lc-opts" id="lc-opts" role="radiogroup" aria-labelledby="lc-title"></div>
    <div class="lc-foot">
      <label class="lc-remember">
        <input type="checkbox" id="lc-remember">
        <span id="lc-remember-label">Always do this</span>
      </label>
      <div class="lc-actions">
        <button class="lc-btn ghost" id="lc-cancel">Cancel</button>
        <button class="lc-btn primary" id="lc-open">Open</button>
      </div>
    </div>
  </div>
</div>
<script>
'use strict';
const { invoke } = window.__TAURI__.core;
const params = new URLSearchParams(location.search);
const requestId = Number(params.get('id') || 0);
const appId = params.get('app') || '';
let appName = '';
let choice = 'new-tab';
let busy = false;

// Same four answers Rambox offers, in the same order, because that is the
// question a user already knows how to answer. "Here" is not the default: it
// replaces the page they were reading, which is the thing they clicked away
// from.
const OPTIONS = [
  {
    id: 'new-tab',
    name: 'New tab',
    desc: 'Open in another tab of this app, signed in as you are now.',
    icon: '<rect x="3" y="4" width="15" height="13" rx="2"/><path d="M3 8h15"/><path d="M7.5 1.5v3M13.5 1.5v3"/>',
  },
  {
    id: 'popup',
    name: 'Pop-up window',
    desc: 'Open in a small separate window, on top of this page.',
    icon: '<rect x="2" y="3" width="16" height="14" rx="2"/><rect x="8.5" y="7.5" width="8.5" height="7" rx="1.2"/>',
  },
  {
    id: 'same',
    name: 'Here, in this tab',
    desc: 'Replace this page. Back returns to it.',
    icon: '<path d="M10 2.5h7.5V10"/><path d="M17.5 2.5 9 11"/><path d="M8 4.5H4.5A1.5 1.5 0 003 6v9.5A1.5 1.5 0 004.5 17H14a1.5 1.5 0 001.5-1.5V12"/>',
  },
  {
    id: 'external',
    name: 'Default browser',
    desc: 'Hand it to the browser outside RustBox. Not signed in there.',
    icon: '<circle cx="10" cy="10" r="7.5"/><path d="M2.5 10h15"/><path d="M10 2.5c2 2.3 3 4.8 3 7.5s-1 5.2-3 7.5c-2-2.3-3-4.8-3-7.5s1-5.2 3-7.5z"/>',
  },
];

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// Host in full weight, the rest dimmed. A link to `example.com/account/orders`
// and one to `example.com/account/settings` look identical when truncated from
// the left, and the path is usually the part that decides the answer.
function renderUrl(raw) {
  const host = document.getElementById('lc-url');
  let parsed;
  try { parsed = new URL(raw); } catch (_) { parsed = null; }
  if (!parsed) { host.textContent = raw; return; }
  const rest = (parsed.pathname === '/' ? '' : parsed.pathname) + parsed.search + parsed.hash;
  host.innerHTML = `<b>${esc(parsed.host)}</b>${esc(rest)}`;
  host.title = raw;
}

async function close() {
  if (busy) return;
  busy = true;
  await invoke('dismiss_link_choice', { id: requestId }).catch(() => {});
}

function select(id, focus) {
  choice = id;
  document.querySelectorAll('.lc-opt').forEach(el => {
    const on = el.dataset.id === id;
    el.setAttribute('aria-checked', on ? 'true' : 'false');
    el.tabIndex = on ? 0 : -1;
    if (on && focus) el.focus({ preventScroll: true });
  });
}

async function open() {
  if (busy) return;
  busy = true;
  const remember = document.getElementById('lc-remember').checked;
  // The window is closed by the backend as part of answering, so there is no
  // success path here to handle: a failure to answer is reported by the tab
  // that asked, not by a dialog that is about to disappear.
  await invoke('resolve_link_choice', { id: requestId, choice, remember }).catch(() => {});
}

(function init() {
  const list = document.getElementById('lc-opts');
  list.innerHTML = OPTIONS.map((o, i) => `
    <button class="lc-opt" role="radio" aria-checked="false" tabindex="-1"
            data-id="${o.id}" data-index="${i}">
      <svg viewBox="0 0 20 20" aria-hidden="true">${o.icon}</svg>
      <span class="body">
        <span class="name">${esc(o.name)}</span>
        <span class="desc">${esc(o.desc)}</span>
      </span>
      <span class="key">${i + 1}</span>
    </button>`).join('');

  renderUrl(params.get('url') || '');

  // Name the browser the OS would actually use. An embedded app never shows it
  // anywhere else: the Settings picker is disabled for embedded, because an
  // embedded tab renders in RustBox's own webview and launches no browser. The
  // plain "Default browser" label left the user guessing which one that was.
  invoke('system_default_browser').then(name => {
    if (!name) return;
    const opt = OPTIONS.find(o => o.id === 'external');
    if (!opt) return;
    opt.name = `Default browser (${name})`;
    const row = list.querySelector('.lc-opt[data-id="external"] .name');
    if (row) row.textContent = opt.name;
  }).catch(() => {});

  // The app's name, so the dialog says whose tab it is about without the user
  // having to look behind it.
  invoke('list_apps').then(apps => {
    const app = (apps || []).find(a => a.id === appId);
    if (!app) return;
    appName = app.name || '';
    document.getElementById('lc-app').textContent = appName;
    document.getElementById('lc-remember-label').textContent =
      `Always do this in ${appName}`;
  }).catch(() => {});

  // Naming the browser the OS would actually use. In an embedded app nothing
  // else ever shows it: the Settings picker is disabled there, because an
  // embedded tab renders in RustBox's own webview and never launches a browser.
  // "Default browser" alone left the user guessing which one would open.
  invoke('system_default_browser').then(name => {
    if (!name) return;
    const opt = OPTIONS.find(o => o.id === 'external');
    if (!opt) return;
    opt.name = `Default browser (${name})`;
    opt.desc = `Hand it to ${name}, the browser outside RustBox. Not signed in there.`;
    const el = list.querySelector('.lc-opt[data-id="external"] .name');
    if (el) el.textContent = opt.name;
    const desc = list.querySelector('.lc-opt[data-id="external"] .desc');
    if (desc) desc.textContent = opt.desc;
  }).catch(() => {});

  select('new-tab', false);

  list.querySelectorAll('.lc-opt').forEach(el => {
    el.addEventListener('click', () => select(el.dataset.id, false));
    // Double-click is the shortcut for "pick this and go", which is what a
    // user who already knows their answer will try.
    el.addEventListener('dblclick', () => { select(el.dataset.id, false); open(); });
    el.addEventListener('mousemove', () => {
      if (el.getAttribute('aria-checked') !== 'true') el.focus({ preventScroll: true });
    });
  });

  document.getElementById('lc-cancel').addEventListener('click', close);
  document.getElementById('lc-open').addEventListener('click', open);
  // Clicking the dimmed area cancels, the way every modal does.
  document.getElementById('scrim').addEventListener('mousedown', (e) => {
    if (e.target.id === 'scrim') close();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { e.preventDefault(); close(); return; }
    if (e.key === 'Enter') {
      e.preventDefault();
      // Enter on a focused option picks it first, then opens; Enter anywhere
      // else opens the current choice.
      const focused = document.activeElement?.closest?.('.lc-opt');
      if (focused) select(focused.dataset.id, true);
      open();
      return;
    }
    const n = Number(e.key);
    if (n >= 1 && n <= OPTIONS.length) {
      e.preventDefault();
      select(OPTIONS[n - 1].id, true);
      return;
    }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      const i = OPTIONS.findIndex(o => o.id === choice);
      const step = e.key === 'ArrowDown' ? 1 : -1;
      select(OPTIONS[(i + step + OPTIONS.length) % OPTIONS.length].id, true);
    }
  });

  // No blur-to-dismiss. This is a separate OS window, so focus legitimately
  // bounces between it and the page that raised the link — dismissing on blur
  // would throw the user's click away the moment they looked at the page to
  // decide. The backend closes the dialog when its context disappears (tab
  // switched, tab or app closed), and Escape / Cancel / the scrim close it here.
  window.focus();
})();
</script>
</body>
</html>
